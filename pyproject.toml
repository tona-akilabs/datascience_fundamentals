[project]
name = "datascience-fundamentals"
version = "0.1.0"
description = ""
authors = [
    {name = "Tona",email = "tona.chheun@akilabs.co"}
]
readme = "README.md"
requires-python = ">=3.14"

[tool.poetry]
packages = [{ include = "datascience", from = "src" }]

